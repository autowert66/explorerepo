name: release

# Push a tag like v0.1.0 to build prebuilt binaries and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the toolchain stamps the tag as the version (explorerepo --version)
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name=explorerepo_${TAG}_${os}_${arch}
            exe=explorerepo; [ "$os" = windows ] && exe=explorerepo.exe
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$name/$exe" ./cmd/explorerepo
            cp README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: check version stamp
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -xzOf dist/explorerepo_${TAG}_linux_amd64.tar.gz explorerepo_${TAG}_linux_amd64/explorerepo > /tmp/explorerepo
          chmod +x /tmp/explorerepo
          /tmp/explorerepo --version | tee /dev/stderr | grep -qF "explorerepo $TAG "
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
